name: Signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify tag matches code version
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/awgctl/version.py)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Test and build
        run: |
          python3 -m unittest discover -s tests -v
          make build
      - name: Sign manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          signing_key=$(mktemp)
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          ssh-keygen -Y sign -q -f "$signing_key" -n file dist/release.json
          ssh-keygen -lf release-signing-key.pub
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            dist/awgctl.pyz \
            dist/release.json \
            dist/release.json.sig \
            --title "AmneziaWG Manager $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
